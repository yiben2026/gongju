<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最新通知</title>
<style>
  :root {
    --primary: #ff6b8a;
    --primary-dark: #e85a78;
    --primary-light: #fff0f3;
    --bg: #fff5f8;
    --border: #ffc4d2;
    --border-light: #ffe4ea;
    --text: #333;
    --text-secondary: #666;
    --card: #fff;
    --shadow: 0 4px 20px rgba(255, 107, 138, 0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--border-light);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-bar a {
    color: var(--primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-bar a:hover { color: var(--primary-dark); }
  .nav-bar .nav-sep { color: #ccc; font-size: 14px; }
  .nav-bar .nav-current { color: var(--text-secondary); font-size: 14px; }
  .nav-bar .cloud-badge {
    margin-left: auto;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 600;
  }
  .nav-bar .cloud-badge.connected { background: #e8f5e9; color: #4caf50; }
  .nav-bar .cloud-badge.syncing { background: #fff3e0; color: #ff9800; }
  .nav-bar .cloud-badge.error { background: #ffebee; color: #f44336; }
  .container {
    max-width: 900px;
    margin: 24px auto 100px;
    padding: 0 20px;
  }
  .page-title {
    text-align: center;
    color: var(--primary);
    font-size: 28px;
    font-weight: 700;
    margin: 16px 0 28px;
    letter-spacing: 2px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar .sync-info {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .toolbar button.sync-btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--primary);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toolbar button.sync-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary);
  }
  .announcements-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .announcement-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
    position: relative;
  }
  .announcement-card:hover {
    border-color: var(--primary);
    box-shadow: 0 6px 24px rgba(255, 107, 138, 0.15);
  }
  .announcement-card.pinned {
    border-color: var(--primary);
    background: linear-gradient(135deg, #fff 0%, #fff5f8 100%);
  }
  .announcement-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .announcement-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary-dark);
    flex: 1;
    word-break: break-word;
  }
  .pin-badge {
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .announcement-meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .announcement-content {
    color: var(--text);
    font-size: 15px;
    word-break: break-word;
    line-height: 1.8;
  }
  .announcement-content img {
    max-width: 100%;
    border-radius: 10px;
    margin: 8px 0;
    display: block;
  }
  .announcement-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-light);
  }
  .announcement-actions button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .announcement-actions button:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .announcement-actions button.delete:hover {
    border-color: #e74c3c;
    color: #e74c3c;
  }
  .fab {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b8a 0%, #ff5270 100%);
    color: #fff;
    border: none;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 107, 138, 0.35);
    transition: all 0.2s ease;
    z-index: 50;
  }
  .fab:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 24px rgba(255, 107, 138, 0.45);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    color: var(--primary);
    margin-bottom: 20px;
    font-size: 22px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s ease;
    background: #fff;
    color: var(--text);
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  .form-group textarea {
    min-height: 160px;
    resize: vertical;
    line-height: 1.7;
  }
  .form-group .hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .image-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .image-toolbar button {
    background: var(--primary-light);
    border: 1px solid var(--border);
    color: var(--primary);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .image-toolbar button:hover {
    background: var(--primary);
    color: #fff;
  }
  .image-toolbar .hint-text {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .image-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .image-preview .img-thumb {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--border);
  }
  .image-preview .img-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-preview .img-thumb .remove-img {
    position: absolute;
    top: 2px;
    right: 2px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .checkbox-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--primary);
  }
  .checkbox-group label {
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
  }
  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    border: none;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b8a 0%, #ff5270 100%);
    color: #fff;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    background: #f5f5f5;
    color: var(--text-secondary);
  }
  .btn-secondary:hover { background: #ebebeb; }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
    font-size: 15px;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.6;
  }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--primary);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 300;
  }
  .toast.show { opacity: 1; }
  .drag-over { border-color: var(--primary) !important; background: var(--primary-light) !important; }
  @media (max-width: 600px) {
    .container { padding: 0 14px; }
    .page-title { font-size: 24px; }
    .announcement-card { padding: 16px; }
    .fab { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 28px; }
  }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="index.html">&larr; 智能校对工具</a>
  <span class="nav-sep">/</span>
  <span class="nav-current">最新通知</span>
  <span class="cloud-badge connected" id="cloudBadge">已连接</span>
</div>

<div class="container">
  <h1 class="page-title">&#128226; 最新通知</h1>
  <div class="toolbar">
    <button class="sync-btn" onclick="syncFromCloud()">&#13219;&#65039; 从云端拉取</button>
    <span class="sync-info" id="syncInfo"></span>
  </div>
  <div id="announcementsList" class="announcements-list"></div>
</div>

<button class="fab" id="fabAdd" title="新增通知">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增通知</h2>
    <form id="announcementForm">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label for="titleInput">标题 <span style="color:#e74c3c">*</span></label>
        <input type="text" id="titleInput" placeholder="通知标题" maxlength="80" required>
      </div>
      <div class="form-group">
        <label for="contentInput">内容 <span style="color:#e74c3c">*</span></label>
        <div class="image-toolbar">
          <button type="button" onclick="document.getElementById('imageInput').click()">&#128247; 插入图片</button>
          <span class="hint-text">也可直接粘贴或拖拽图片到输入框</span>
          <input type="file" id="imageInput" accept="image/*" multiple style="display:none" onchange="handleImageFiles(this.files)">
        </div>
        <textarea id="contentInput" placeholder="通知正文内容，支持插入图片" required></textarea>
        <div class="hint">支持换行，可直接粘贴/拖拽图片。图片会自动压缩。</div>
        <div class="image-preview" id="imagePreview"></div>
      </div>
      <div class="form-group">
        <label for="authorInput">发布人</label>
        <input type="text" id="authorInput" placeholder="例如：柚柚" maxlength="20">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="pinnedInput">
        <label for="pinnedInput">&#128204; 置顶显示</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCancel">取消</button>
        <button type="submit" class="btn btn-primary" id="btnSave">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'gongju_announcements_v1';
  var GITEE_API = 'https://gitee.com/api/v5';
  var GITEE_FILE_PATH = 'announcements.json';

  // 内置云端配置
  var DEFAULT_CLOUD_CONFIG = {
    giteeUser: 'yibenai',
    giteeRepo: 'zuixintongzhi',
    giteeToken: '5c256881414ea0e9b4014143d52d61c9'
  };

  var announcements = loadLocal();
  var pendingImages = []; // 待插入的图片 base64 列表

  // ===== 本地存储 =====
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error('读取通知失败:', e); }
    var demo = [{
      id: genId(),
      title: '欢迎使用最新通知',
      content: '点击右下角「+」按钮即可新增通知。\n\n通知支持置顶、编辑、删除、插入图片，数据自动同步到云端，团队所有人共享。',
      author: '系统',
      pinned: true,
      createdAt: Date.now(),
      updatedAt: Date.now()
    }];
    saveLocal(demo);
    return demo;
  }
  function saveLocal(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    catch (e) { showToast('保存失败：' + e.message); }
  }
  function genId() {
    return 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }
  function formatDate(ts) {
    var d = new Date(ts);
    var pad = function(n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ===== 图片处理 =====
  function compressImage(file, maxW, quality, cb) {
    maxW = maxW || 1000;
    quality = quality || 0.7;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // PNG with transparency -> keep PNG; otherwise JPEG
        var mime = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
        var dataUrl = canvas.toDataURL(mime, quality);
        cb(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.handleImageFiles = function(files) {
    if (!files || !files.length) return;
    var textarea = document.getElementById('contentInput');
    for (var i = 0; i < files.length; i++) {
      if (!files[i].type.startsWith('image/')) continue;
      (function(file) {
        compressImage(file, 1000, 0.7, function(dataUrl) {
          var marker = '![](' + dataUrl + ')';
          var pos = textarea.selectionStart;
          var before = textarea.value.substring(0, pos);
          var after = textarea.value.substring(textarea.selectionEnd);
          var insertText = (before && !before.endsWith('\n')) ? '\n' + marker : marker;
          if (after && !after.startsWith('\n')) insertText += '\n';
          textarea.value = before + insertText + after;
          textarea.focus();
          textarea.selectionStart = textarea.selectionEnd = pos + insertText.length;
          renderImagePreview(textarea.value);
        });
      })(files[i]);
    }
    document.getElementById('imageInput').value = '';
  };

  function renderImagePreview(content) {
    var preview = document.getElementById('imagePreview');
    var regex = /!\[\]\((data:image\/[^)]+)\)/g;
    var matches = [];
    var m;
    while ((m = regex.exec(content)) !== null) {
      matches.push(m[1]);
    }
    if (!matches.length) { preview.innerHTML = ''; return; }
    preview.innerHTML = matches.map(function(src, i) {
      return '<div class="img-thumb"><img src="' + src + '"><button type="button" class="remove-img" onclick="removeImage(' + i + ')">&times;</button></div>';
    }).join('');
  }

  window.removeImage = function(index) {
    var textarea = document.getElementById('contentInput');
    var regex = /!\[\]\(data:image\/[^)]+\)/g;
    var count = 0;
    var newContent = textarea.value.replace(regex, function(match) {
      if (count === index) { count++; return ''; }
      count++;
      return match;
    }).replace(/\n{3,}/g, '\n\n').trim();
    textarea.value = newContent + '\n';
    renderImagePreview(textarea.value);
  };

  // ===== 渲染 =====
  function renderContent(content) {
    // 转义 HTML
    var html = escapeHtml(content);
    // 图片标记 ![alt](src) -> <img>
    html = html.replace(/!\[([^\]]*)\]\((data:image\/[^)]+|https?:\/\/[^)]+)\)/g, function(match, alt, src) {
      return '<img src="' + src + '" alt="' + alt + '">';
    });
    // 换行
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var list = document.getElementById('announcementsList');
    if (!announcements.length) {
      list.innerHTML = '<div class="empty-state"><div class="icon">empty</div><div>暂无通知</div><div style="margin-top:8px;font-size:13px;">点击右下角「+」新增一条通知</div></div>';
      return;
    }
    var sorted = announcements.slice().sort(function(a, b) {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      return b.updatedAt - a.updatedAt;
    });
    list.innerHTML = sorted.map(function(a) {
      var updated = (a.updatedAt && a.updatedAt !== a.createdAt) ? '更新于 ' + formatDate(a.updatedAt) : '';
      return '<div class="announcement-card ' + (a.pinned ? 'pinned' : '') + '">' +
        '<div class="announcement-header">' +
          '<div class="announcement-title">' + escapeHtml(a.title) + '</div>' +
          (a.pinned ? '<span class="pin-badge">置顶</span>' : '') +
        '</div>' +
        '<div class="announcement-meta">' +
          '<span>📅 ' + formatDate(a.createdAt) + '</span>' +
          (a.author ? '<span>👤 ' + escapeHtml(a.author) + '</span>' : '') +
          (updated ? '<span>✏️ ' + updated + '</span>' : '') +
        '</div>' +
        '<div class="announcement-content">' + renderContent(a.content) + '</div>' +
        '<div class="announcement-actions">' +
          '<button data-action="edit" data-id="' + a.id + '">编辑</button>' +
          '<button data-action="pin" data-id="' + a.id + '">' + (a.pinned ? '取消置顶' : '置顶') + '</button>' +
          '<button data-action="delete" data-id="' + a.id + '" class="delete">删除</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 1800);
  }

  function setBadge(type, text) {
    var badge = document.getElementById('cloudBadge');
    badge.className = 'cloud-badge ' + type;
    badge.textContent = text;
  }

  // ===== Gitee API =====
  function giteeReadFile(cb) {
    var cfg = DEFAULT_CLOUD_CONFIG;
    var url = GITEE_API + '/repos/' + cfg.giteeUser + '/' + cfg.giteeRepo + '/contents/' + GITEE_FILE_PATH + '?access_token=' + encodeURIComponent(cfg.giteeToken);
    fetch(url, { cache: 'no-cache' })
      .then(function(resp) {
        if (resp.status === 404) return null;
        if (!resp.ok) throw new Error('读取失败 (' + resp.status + ')');
        return resp.json();
      })
      .then(function(json) {
        if (!json) { cb(null, null); return; }
        if (Array.isArray(json) && json.length === 0) { cb(null, null); return; }
        try {
          var content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
          cb(JSON.parse(content), json.sha);
        } catch(e) { cb(null, null); }
      })
      .catch(function(e) { cb(null, null, e); });
  }

  function giteeWriteFile(data, sha, cb) {
    var cfg = DEFAULT_CLOUD_CONFIG;
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    var body = { content: content, message: '更新通知 ' + new Date().toLocaleString() };
    if (sha) body.sha = sha;
    var url = GITEE_API + '/repos/' + cfg.giteeUser + '/' + cfg.giteeRepo + '/contents/' + GITEE_FILE_PATH + '?access_token=' + encodeURIComponent(cfg.giteeToken);
    fetch(url, {
      method: sha ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function(resp) {
        if (!resp.ok) return resp.text().then(function(t) { throw new Error('写入失败 (' + resp.status + '): ' + t.substring(0, 150)); });
        return resp.json();
      })
      .then(function(json) { cb(true, json); })
      .catch(function(e) { cb(false, null, e); });
  }

  function giteeCreateRepo(cb) {
    var cfg = DEFAULT_CLOUD_CONFIG;
    var url = GITEE_API + '/user/repos?access_token=' + encodeURIComponent(cfg.giteeToken);
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: cfg.giteeRepo, private: false, auto_init: true })
    })
      .then(function(resp) {
        if (resp.status === 422) { cb(true); return; }
        if (!resp.ok) { resp.text().then(function(t) { cb(false, new Error(t.substring(0, 150))); }); return; }
        cb(true);
      })
      .catch(function(e) { cb(false, e); });
  }

  // ===== 云端同步 =====
  window.syncFromCloud = function() {
    setBadge('syncing', '同步中...');
    var info = document.getElementById('syncInfo');
    info.textContent = '正在从云端拉取...';
    giteeReadFile(function(cloudData, sha, err) {
      if (err && !cloudData) {
        // 404 且本地有数据：自动上传到云端
        if (err.message && err.message.indexOf('404') !== -1 && announcements.length > 0) {
          info.textContent = '云端暂无数据，正在上传本地数据...';
          pushToCloud();
          return;
        }
        setBadge('error', '同步失败');
        info.textContent = '拉取失败: ' + err.message;
        setTimeout(function() { setBadge('connected', '已连接'); }, 3000);
        return;
      }
      if (!cloudData) {
        // 云端仓库/文件不存在，但本地有数据，自动上传
        if (announcements.length > 0) {
          info.textContent = '云端暂无数据，正在上传本地数据...';
          pushToCloud();
        } else {
          setBadge('connected', '已连接');
          info.textContent = '云端暂无数据';
        }
        return;
      }
      var cloudList = (cloudData.announcements && Array.isArray(cloudData.announcements)) ? cloudData.announcements : [];
      // 合并：以 id 为唯一标识，云端+本地合并，updatedAt 更新的优先
      var map = {};
      announcements.forEach(function(a) { map[a.id] = a; });
      cloudList.forEach(function(a) {
        if (!map[a.id]) {
          map[a.id] = a;
        } else {
          // 冲突时取 updatedAt 更新的
          if ((a.updatedAt || 0) > (map[a.id].updatedAt || 0)) {
            map[a.id] = a;
          }
        }
      });
      var merged = Object.keys(map).map(function(k) { return map[k]; });
      announcements = merged;
      saveLocal(announcements);
      render();
      setBadge('connected', '已连接');
      info.textContent = '已同步 ' + cloudList.length + ' 条云端通知 (' + (cloudData.updatedAt || '') + ')';
    });
  };

  function pushToCloud() {
    setBadge('syncing', '上传中...');
    var info = document.getElementById('syncInfo');
    info.textContent = '正在同步到云端...';

    function buildMerged(cloudList) {
      var map = {};
      (cloudList || []).forEach(function(a) { map[a.id] = a; });
      announcements.forEach(function(a) {
        if (!map[a.id] || (a.updatedAt || 0) >= (map[a.id].updatedAt || 0)) {
          map[a.id] = a;
        }
      });
      return Object.keys(map).map(function(k) { return map[k]; });
    }

    function doWrite(sha, merged) {
      var payload = { announcements: merged, updatedAt: new Date().toISOString() };
      giteeWriteFile(payload, sha, function(ok, json, err) {
        if (ok) {
          setBadge('connected', '已连接');
          info.textContent = '已同步到云端 ' + formatDate(Date.now());
          showToast('已同步到云端');
        } else {
          setBadge('error', '上传失败');
          var msg = err && err.message ? err.message : '未知错误';
          info.textContent = '同步失败: ' + msg;
          console.error('pushToCloud 失败:', err);
          showToast('同步失败: ' + msg);
          setTimeout(function() { setBadge('connected', '已连接'); }, 3000);
        }
      });
    }

    giteeReadFile(function(cloudData, sha, err) {
      // 404 说明仓库或文件不存在，尝试创建仓库后再写入
      if (err && err.message && err.message.indexOf('404') !== -1) {
        info.textContent = '云端仓库不存在，正在创建...';
        giteeCreateRepo(function(ok, createErr) {
          if (ok) {
            doWrite(null, announcements.slice());
          } else {
            setBadge('error', '创建仓库失败');
            var msg = createErr && createErr.message ? createErr.message : '未知错误';
            info.textContent = '创建仓库失败: ' + msg;
            showToast('创建云端仓库失败: ' + msg);
            setTimeout(function() { setBadge('connected', '已连接'); }, 3000);
          }
        });
        return;
      }
      var merged = buildMerged((cloudData && cloudData.announcements) ? cloudData.announcements : []);
      doWrite(sha || null, merged);
    });
  }

  // ===== 弹窗操作 =====
  function openModal(editTarget) {
    document.getElementById('modalTitle').textContent = editTarget ? '编辑通知' : '新增通知';
    document.getElementById('editId').value = editTarget ? editTarget.id : '';
    document.getElementById('titleInput').value = editTarget ? editTarget.title : '';
    document.getElementById('contentInput').value = editTarget ? editTarget.content : '';
    document.getElementById('authorInput').value = editTarget ? (editTarget.author || '') : '';
    document.getElementById('pinnedInput').checked = editTarget ? !!editTarget.pinned : false;
    document.getElementById('imagePreview').innerHTML = '';
    renderImagePreview(document.getElementById('contentInput').value);
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(function() { document.getElementById('titleInput').focus(); }, 50);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('announcementForm').reset();
    document.getElementById('imagePreview').innerHTML = '';
  }

  function handleSave(e) {
    e.preventDefault();
    var title = document.getElementById('titleInput').value.trim();
    var content = document.getElementById('contentInput').value.trim();
    var author = document.getElementById('authorInput').value.trim();
    var pinned = document.getElementById('pinnedInput').checked;
    var editId = document.getElementById('editId').value;

    if (!title) { showToast('请填写标题'); return; }
    if (!content) { showToast('请填写内容'); return; }

    if (editId) {
      var idx = announcements.findIndex(function(a) { return a.id === editId; });
      if (idx >= 0) {
        announcements[idx].title = title;
        announcements[idx].content = content;
        announcements[idx].author = author;
        announcements[idx].pinned = pinned;
        announcements[idx].updatedAt = Date.now();
        showToast('已更新');
      }
    } else {
      announcements.unshift({
        id: genId(), title: title, content: content, author: author, pinned: pinned,
        createdAt: Date.now(), updatedAt: Date.now()
      });
      showToast('已新增');
    }
    saveLocal(announcements);
    render();
    closeModal();
    pushToCloud();
  }

  function handleListClick(e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var id = btn.dataset.id;
    var action = btn.dataset.action;
    var target = announcements.find(function(a) { return a.id === id; });
    if (!target) return;

    if (action === 'edit') {
      openModal(target);
    } else if (action === 'pin') {
      target.pinned = !target.pinned;
      target.updatedAt = Date.now();
      saveLocal(announcements);
      render();
      showToast(target.pinned ? '已置顶' : '已取消置顶');
      pushToCloud();
    } else if (action === 'delete') {
      if (!confirm('确定删除「' + target.title + '」吗？')) return;
      announcements = announcements.filter(function(a) { return a.id !== id; });
      saveLocal(announcements);
      render();
      showToast('已删除');
      pushToCloud();
    }
  }

  // ===== 事件绑定 =====
  document.getElementById('fabAdd').addEventListener('click', function() { openModal(null); });
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('announcementForm').addEventListener('submit', handleSave);
  document.getElementById('announcementsList').addEventListener('click', handleListClick);

  // 内容输入框：粘贴图片 + 拖拽图片
  var contentInput = document.getElementById('contentInput');
  contentInput.addEventListener('paste', function(e) {
    var items = e.clipboardData.items;
    var hasImage = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.startsWith('image/')) {
        hasImage = true;
        var file = items[i].getAsFile();
        handleImageFiles([file]);
      }
    }
    if (hasImage) e.preventDefault();
  });
  contentInput.addEventListener('dragover', function(e) {
    e.preventDefault();
    contentInput.classList.add('drag-over');
  });
  contentInput.addEventListener('dragleave', function(e) {
    contentInput.classList.remove('drag-over');
  });
  contentInput.addEventListener('drop', function(e) {
    e.preventDefault();
    contentInput.classList.remove('drag-over');
    var files = [];
    for (var i = 0; i < e.dataTransfer.files.length; i++) {
      if (e.dataTransfer.files[i].type.startsWith('image/')) files.push(e.dataTransfer.files[i]);
    }
    if (files.length) handleImageFiles(files);
  });
  // 输入时更新图片预览
  contentInput.addEventListener('input', function() { renderImagePreview(this.value); });

  // ===== 初始化 =====
  render();
  // 页面加载时自动从云端拉取
  syncFromCloud();
})();
</script>
